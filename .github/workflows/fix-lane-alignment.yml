name: Fix lane alignment
on:
  push:
    paths:
      - '.github/workflows/fix-lane-alignment.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep runners level across lanes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()
          old='''  var center=(total-1)/2;\n  var visualProgress=r.progress + (idx-center)*0.0018;\n  var p=pointOnPill(visualProgress,0,1,g);\n  var before=pointOnPill(visualProgress-0.002,0,1,g);\n  var after=pointOnPill(visualProgress+0.002,0,1,g);'''
          new='''  var center=(total-1)/2;\n  var visualProgress=r.progress;\n  var p=pointOnPill(visualProgress,0,1,g);\n  var before=pointOnPill(visualProgress-0.002,0,1,g);\n  var after=pointOnPill(visualProgress+0.002,0,1,g);'''
          if old not in s:
              raise SystemExit('target raceVisualPoint block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('game.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/game.js').write_text(m.group(1))
          PY
          node --check /tmp/game.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html
          git commit -m 'Keep runners level across lanes'
          git rm .github/workflows/fix-lane-alignment.yml
          git commit -m 'Remove lane alignment patch workflow'
          git push
