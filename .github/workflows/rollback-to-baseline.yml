name: Restore Racing baseline
on:
  push:
    paths:
      - '.github/workflows/rollback-to-baseline.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact baseline tree
        run: |
          set -e
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .
          git checkout silk-baseline-2026-08-07 -- .
          git commit -m "Restore Racing Game to saved baseline"
          git push origin main
