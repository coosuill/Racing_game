name: Fix racing central infield

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-central-infield.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch game and wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          game = Path('game.html')
          text = game.read_text(encoding='utf-8')
          text = re.sub(r'\n?<!-- CHATGPT_CENTRAL_INFIELD_START -->.*?<!-- CHATGPT_CENTRAL_INFIELD_END -->\n?', '\n', text, flags=re.S)

          patch = r'''<!-- CHATGPT_CENTRAL_INFIELD_START -->
          <style id="chatgpt-central-infield-style">
          .banner{display:none!important;}
          .lap-counter{left:10px!important;right:auto!important;top:10px!important;z-index:6!important;padding:7px 10px!important;border-radius:999px!important;background:rgba(0,0,0,.62)!important;color:#fff!important;font-size:13px!important;font-weight:bold!important;pointer-events:none!important}
          #trackInfo{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;max-width:none!important;margin:0!important;overflow:hidden!important}
          .latest-change-note{display:inline-block!important;margin-left:8px!important;font-size:9px!important;line-height:1.1!important;font-weight:normal!important;letter-spacing:0!important;opacity:.58!important;vertical-align:middle!important;white-space:nowrap!important}
          @media(max-width:760px){#trackInfo{padding:5px!important}#trackInfo .track-info-grid{grid-template-columns:1fr!important;gap:3px!important}#trackInfo .track-info-section{padding:3px 4px!important}#trackInfo .track-live-list,#trackInfo .track-score-list,#trackInfo .track-result-list{font-size:8px!important}#trackInfo .track-live-row{grid-template-columns:17px minmax(38px,1fr) auto auto auto!important;gap:2px!important}#trackInfo .track-live-row .ability,#trackInfo .track-live-row .race-state,#trackInfo .track-live-row .gap-cell{font-size:7px!important}}
          </style>
          <script id="chatgpt-central-infield-script">
          (function(){
            var latestText='Latest: positions central infield · lap top-left';
            function ensureLatestNote(){
              var h=document.querySelector('h1'); if(!h)return;
              var note=document.getElementById('latestChangeNote');
              if(!note){note=document.createElement('span');note.id='latestChangeNote';note.className='latest-change-note';h.appendChild(note);}
              note.textContent=latestText;
            }
            function pinToCentralInfield(){
              try{
                var info=document.getElementById('trackInfo');
                if(!info||typeof geometry!=='function')return;
                var g=geometry(); if(!g)return;
                var innerWidth=Math.max(1,g.innerRight-g.innerLeft);
                var innerHeight=Math.max(1,g.innerBottom-g.innerTop);
                var safeWidth=Math.max(1,Math.min(620,innerWidth*0.54));
                var safeHeight=Math.max(1,innerHeight*0.50);
                info.style.setProperty('left',g.cx+'px','important');
                info.style.setProperty('top',g.cy+'px','important');
                info.style.setProperty('width',safeWidth+'px','important');
                info.style.setProperty('max-height',safeHeight+'px','important');
                info.style.setProperty('transform','translate(-50%,-50%)','important');
                info.style.setProperty('overflow','hidden','important');
              }catch(e){}
            }
            function apply(){ensureLatestNote();pinToCentralInfield();}
            window.addEventListener('resize',apply);
            if(window.ResizeObserver){var shell=document.getElementById('trackShell');if(shell){var ro=new ResizeObserver(function(){requestAnimationFrame(pinToCentralInfield)});ro.observe(shell);}}
            var info=document.getElementById('trackInfo');
            if(info&&window.MutationObserver){var mo=new MutationObserver(function(){requestAnimationFrame(pinToCentralInfield)});mo.observe(info,{childList:true,subtree:true,characterData:true});}
            apply();setTimeout(apply,100);setTimeout(apply,500);setInterval(pinToCentralInfield,500);
          })();
          </script>
          <!-- CHATGPT_CENTRAL_INFIELD_END -->'''
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in patch.splitlines())
          if '</body>' not in text:
              raise SystemExit('Could not find </body> in game.html')
          text = text.replace('</body>', patch + '\n</body>', 1)
          game.write_text(text, encoding='utf-8')

          wrapper = '''<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>O'Sullivan Clan Racing</title>
          <style>html,body{margin:0;padding:0;width:100%;min-height:100%;background:#07120c;overflow-x:hidden}#game{display:block;width:100%;border:0;min-height:100vh}</style>
          </head>
          <body>
          <iframe id="game" src="game.html" title="O'Sullivan Clan Racing"></iframe>
          <script>
          const frame=document.getElementById('game');
          function sizeFrame(){try{const doc=frame.contentDocument;if(!doc)return;frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0,window.innerHeight)+'px';}catch(e){frame.style.height='100vh';}}
          frame.addEventListener('load',()=>{sizeFrame();setTimeout(sizeFrame,250);setTimeout(sizeFrame,1000);try{const doc=frame.contentDocument;if(window.ResizeObserver&&doc){const ro=new ResizeObserver(sizeFrame);ro.observe(doc.documentElement);if(doc.body)ro.observe(doc.body);}}catch(e){}});
          window.addEventListener('resize',sizeFrame);
          </script>
          </body>
          </html>
          '''
          wrapper = '\n'.join(line[10:] if line.startswith('          ') else line for line in wrapper.splitlines()) + '\n'
          Path('index.html').write_text(wrapper, encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ['game.html','index.html']:
              text=Path(name).read_text(encoding='utf-8')
              for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)):
                  Path('/tmp/%s_%d.js' % (name.replace('.','_'),i)).write_text(s,encoding='utf-8')
          PY
          for f in /tmp/game_html_*.js /tmp/index_html_*.js; do if [ -e "$f" ]; then node --check "$f"; fi; done
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.html index.html
          git commit -m 'Lock standings to central infield'
          git rm .github/workflows/fix-central-infield.yml
          git commit -m 'Remove central infield helper'
          git push origin main
