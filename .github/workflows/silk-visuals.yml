name: Silk runner visuals
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()
          s=s.replace('if(!force && now - lastOverlayRenderAt < 180) return;','if(!force && now - lastOverlayRenderAt < 300) return;',1)
          s=s.replace('var size = total <= 4 ? 30 : total <= 8 ? 24 : 17;','var size = total <= 4 ? 34 : total <= 8 ? 28 : 21;',1)
          old="""  ctx.beginPath();
          ctx.arc(0, 0, size/2, 0, Math.PI*2);
          ctx.stroke();

          if(fallingNow){"""
          new="""  ctx.beginPath();
          ctx.arc(0, 0, size/2, 0, Math.PI*2);
          ctx.stroke();

          var liveLeader = sortedRaceOrder()[0];
          if(liveLeader && liveLeader.name === r.name && r.finishTime === null){
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, size/2 + 4, 0, Math.PI*2);
            ctx.stroke();
          }

          if(fallingNow){"""
          if old not in s: raise SystemExit('leader insertion point missing')
          s=s.replace(old,new,1)
          old="""  ctx.fillText(r.name, p.x, p.y + size/2 + Math.max(lift, 0) + 4);
          }"""
          new="""  ctx.fillText(r.name, p.x, p.y + size/2 + Math.max(lift, 0) + 4);

          if(r.finishTime !== null){
            var finishers = currentRace.filter(function(x){ return x.finishTime !== null; }).sort(function(a,b){ return a.finishTime-b.finishTime; });
            var place = finishers.indexOf(r) + 1;
            if(place > 0){
              ctx.beginPath();
              ctx.fillStyle = 'rgba(0,0,0,.82)';
              ctx.arc(p.x + size/2 - 2, p.y - size/2 + 2, 9, 0, Math.PI*2);
              ctx.fill();
              ctx.fillStyle = '#ffd166';
              ctx.font = 'bold 10px Arial';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(String(place), p.x + size/2 - 2, p.y - size/2 + 2);
            }
          }
          }"""
          if old not in s: raise SystemExit('finish badge insertion point missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Check game JavaScript
        run: |
          python - <<'PY'
          import re,pathlib,subprocess,tempfile
          s=pathlib.Path('game.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          f=tempfile.NamedTemporaryFile(delete=False,suffix='.js',mode='w')
          f.write(js); f.close()
          subprocess.check_call(['node','--check',f.name])
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/silk-visuals.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve runner visuals for Silk TV"
          git push origin main
