name: Silk runner visuals
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()
          a='if(!force && now - lastOverlayRenderAt < 180) return;'
          b='if(!force && now - lastOverlayRenderAt < 300) return;'
          if a not in s: raise SystemExit('overlay throttle text missing')
          s=s.replace(a,b,1)
          a='var size = total <= 4 ? 30 : total <= 8 ? 24 : 17;'
          b='var size = total <= 4 ? 34 : total <= 8 ? 28 : 21;'
          if a not in s: raise SystemExit('runner size text missing')
          s=s.replace(a,b,1)
          a='  ctx.arc(0, 0, size/2, 0, Math.PI*2);\n  ctx.stroke();\n\n  if(fallingNow){'
          b='  ctx.arc(0, 0, size/2, 0, Math.PI*2);\n  ctx.stroke();\n\n  var liveLeader = sortedRaceOrder()[0];\n  if(liveLeader && liveLeader.name === r.name && r.finishTime === null){\n    ctx.strokeStyle = "#ffd166";\n    ctx.lineWidth = 3;\n    ctx.beginPath();\n    ctx.arc(0, 0, size/2 + 4, 0, Math.PI*2);\n    ctx.stroke();\n  }\n\n  if(fallingNow){'
          if a not in s: raise SystemExit('leader insertion point missing')
          s=s.replace(a,b,1)
          a='  ctx.fillText(r.name, p.x, p.y + size/2 + Math.max(lift, 0) + 4);\n}'
          b='  ctx.fillText(r.name, p.x, p.y + size/2 + Math.max(lift, 0) + 4);\n\n  if(r.finishTime !== null){\n    var finishers = currentRace.filter(function(x){ return x.finishTime !== null; }).sort(function(a,b){ return a.finishTime-b.finishTime; });\n    var place = finishers.indexOf(r) + 1;\n    if(place > 0){\n      ctx.beginPath();\n      ctx.fillStyle = "rgba(0,0,0,.82)";\n      ctx.arc(p.x + size/2 - 2, p.y - size/2 + 2, 9, 0, Math.PI*2);\n      ctx.fill();\n      ctx.fillStyle = "#ffd166";\n      ctx.font = "bold 10px Arial";\n      ctx.textAlign = "center";\n      ctx.textBaseline = "middle";\n      ctx.fillText(String(place), p.x + size/2 - 2, p.y - size/2 + 2);\n    }\n  }\n}'
          if a not in s: raise SystemExit('finish badge insertion point missing')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Check game JavaScript
        run: |
          python - <<'PY'
          import re,pathlib,subprocess,tempfile
          s=pathlib.Path('game.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          f=tempfile.NamedTemporaryFile(delete=False,suffix='.js',mode='w')
          f.write(js);f.close()
          subprocess.check_call(['node','--check',f.name])
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/silk-visuals.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve runner visuals for Silk TV"
          git push origin main
