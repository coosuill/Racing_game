name: Save Silk baseline
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git tag silk-baseline-2026-08-07 753c0bda325f2e8304bdcc5cc345f05ff928cc5f || true
      - run: git push origin silk-baseline-2026-08-07 || true
      - run: rm -f .github/workflows/save-silk-baseline.yml
      - run: git config user.name github-actions[bot]
      - run: git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: git add -A && git commit -m "Remove baseline helper workflow" && git push origin main
