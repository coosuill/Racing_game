name: Race layout update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update race layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.html')
          s=p.read_text()
          def rep(old,new):
              global s
              if old not in s:
                  raise SystemExit('Expected block not found: '+old[:120].replace('\n',' | '))
              s=s.replace(old,new,1)

          rep('''.banner{\n  position:absolute;left:10px;top:10px;padding:7px 10px;border-radius:999px;\n  background:rgba(0,0,0,.62);font-size:13px;font-weight:bold\n}''','''.banner{\n  position:absolute;left:10px;top:10px;padding:7px 10px;border-radius:999px;\n  background:rgba(0,0,0,.62);font-size:13px;font-weight:bold\n}\n.lap-counter{\n  position:absolute;right:10px;top:10px;z-index:4;\n  padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.58);\n  color:#fff;font-size:11px;font-weight:bold;pointer-events:none\n}''')

          rep('''        <div class="banner" id="banner"><span id="status">Ready</span></div>\n        <div class="track-info" id="trackInfo"></div>''','''        <div class="banner" id="banner"><span id="status">Ready</span></div>\n        <div class="lap-counter" id="lapCounter">Laps: 0 / 3</div>\n        <div class="track-info" id="trackInfo"></div>''')

          old='''function drawFaceToken(r, idx, total, g){\n  var p = pointOnPill(r.progress, idx, total, g);\n  var size = total <= 4 ? 30 : total <= 8 ? 26 : 22;'''
          new='''function lineupPoint(idx,total,g){\n  var lineTop = g.outerTop + 7;\n  var lineBottom = g.innerTop - 7;\n  var y = total <= 1 ? (lineTop + lineBottom) / 2 : lineTop + (lineBottom-lineTop) * (idx/(total-1));\n  return {x:g.cx,y:y};\n}\n\nfunction raceVisualPoint(r,idx,total,g){\n  if(r.progress <= 0.00001 || r.finishTime !== null) return lineupPoint(idx,total,g);\n\n  var center=(total-1)/2;\n  var visualProgress=r.progress + (idx-center)*0.0018;\n  var p=pointOnPill(visualProgress,0,1,g);\n  var before=pointOnPill(visualProgress-0.002,0,1,g);\n  var after=pointOnPill(visualProgress+0.002,0,1,g);\n  var dx=after.x-before.x, dy=after.y-before.y;\n  var len=Math.sqrt(dx*dx+dy*dy)||1;\n  var nx=-dy/len, ny=dx/len;\n  var trackWidth=Math.max(32,g.innerTop-g.outerTop);\n  var maxSpread=trackWidth*0.42;\n  var laneOffset=total<=1?0:(idx-center)*(maxSpread/Math.max(1,center));\n  return {x:p.x+nx*laneOffset,y:p.y+ny*laneOffset};\n}\n\nfunction drawFaceToken(r, idx, total, g){\n  var p = raceVisualPoint(r, idx, total, g);\n  var size = total <= 4 ? 30 : total <= 8 ? 24 : 17;'''
          rep(old,new)

          rep('''  currentRace.forEach(function(r, idx){\n    drawFaceToken(r, idx, currentRace.length || 1, g);\n  });\n\n  renderTrackOverlay(false);''','''  currentRace.forEach(function(r, idx){\n    drawFaceToken(r, idx, currentRace.length || 1, g);\n  });\n\n  var lapCounterEl=document.getElementById("lapCounter");\n  if(lapCounterEl){\n    var completed=0;\n    if(currentRace.length){\n      completed=Math.floor(Math.max.apply(null,currentRace.map(function(r){ return r.progress; })));\n      completed=Math.max(0,Math.min(currentRaceLaps,completed));\n    }\n    lapCounterEl.textContent="Laps: "+completed+" / "+currentRaceLaps;\n  }\n\n  renderTrackOverlay(false);''')

          p.write_text(s)
          wf=Path('.github/workflows/race-layout-update.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('game.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/racing.js').write_text(js)
          PY
          node --check /tmp/racing.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html .github/workflows
          git commit -m "Line up runners and add lap counter"
          git push
