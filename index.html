<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>O'Sullivan Clan Racing</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#07120c;overflow-x:hidden}
#game{display:block;width:100%;border:0;min-height:100vh}
</style>
</head>
<body>
<iframe id="game" src="game.html?v=20260808-0938-liveinfield" title="O'Sullivan Clan Racing"></iframe>
<script>
const frame=document.getElementById('game');

function sizeFrame(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0,window.innerHeight)+'px';
  }catch(e){frame.style.height='100vh';}
}

function installRacingFix(){
  try{
    const win=frame.contentWindow;
    const doc=frame.contentDocument;
    if(!win||!doc)return;

    let style=doc.getElementById('outer-live-infield-fix');
    if(!style){
      style=doc.createElement('style');
      style.id='outer-live-infield-fix';
      style.textContent=`
        .banner{display:none!important;}
        .lap-counter{
          left:10px!important;right:auto!important;top:10px!important;z-index:7!important;
          padding:7px 10px!important;border-radius:999px!important;
          background:rgba(0,0,0,.62)!important;color:#fff!important;
          font-size:13px!important;font-weight:bold!important;pointer-events:none!important;
        }
        #trackInfo{
          position:absolute!important;
          z-index:5!important;
          box-sizing:border-box!important;
          margin:0!important;
          overflow:hidden!important;
          pointer-events:none!important;
        }
        #latestChangeNote{
          display:inline-block!important;margin-left:7px!important;font-size:9px!important;
          line-height:1.1!important;font-weight:normal!important;letter-spacing:0!important;
          color:var(--muted)!important;opacity:.70!important;vertical-align:middle!important;white-space:nowrap!important;
        }
        @media(max-width:760px){
          #trackInfo{padding:5px!important;}
          #trackInfo .track-info-grid{grid-template-columns:1fr!important;gap:3px!important;}
          #trackInfo .track-info-section{padding:3px 4px!important;}
          #trackInfo .track-live-list,#trackInfo .track-score-list,#trackInfo .track-result-list{font-size:8px!important;}
          #trackInfo .track-live-row{grid-template-columns:17px minmax(38px,1fr) auto auto auto!important;gap:2px!important;}
          #trackInfo .track-live-row .ability,#trackInfo .track-live-row .race-state,#trackInfo .track-live-row .gap-cell{font-size:7px!important;}
          #latestChangeNote{font-size:8px!important;white-space:normal!important;}
        }
      `;
      doc.head.appendChild(style);
    }

    const heading=doc.querySelector('h1');
    if(heading){
      let note=doc.getElementById('latestChangeNote');
      if(!note){
        note=doc.createElement('span');
        note.id='latestChangeNote';
        heading.appendChild(note);
      }
      note.textContent='Latest: live positions restored + locked infield · single Race panel removed';
    }

    const shell=doc.getElementById('trackShell');
    const info=doc.getElementById('trackInfo');
    if(!shell||!info||typeof win.geometry!=='function')return;

    // Remove the abandoned copied HUD from the previous attempt, if present.
    const staleZone=doc.getElementById('safeInfieldHudZone');
    if(staleZone)staleZone.remove();

    // Keep the real live positions element directly in the track shell.
    if(info.parentNode!==shell){
      const commentary=doc.getElementById('commentary');
      shell.insertBefore(info,commentary||null);
    }

    function hideSimpleRacePanel(){
      const title=doc.getElementById('metaTitle');
      if(!title)return;
      const section=title.closest('section.panel');
      if(!section)return;
      section.style.display=title.textContent.trim()==='Race'?'none':'';
    }

    if(!win.__liveInfieldLockStarted){
      win.__liveInfieldLockStarted=true;
      const lock=()=>{
        try{
          const currentInfo=doc.getElementById('trackInfo');
          const currentShell=doc.getElementById('trackShell');
          if(!currentInfo||!currentShell||typeof win.geometry!=='function')return;

          if(currentInfo.parentNode!==currentShell){
            const commentary=doc.getElementById('commentary');
            currentShell.insertBefore(currentInfo,commentary||null);
          }

          const g=win.geometry();
          const innerW=Math.max(1,g.innerRight-g.innerLeft);
          const innerH=Math.max(1,g.innerBottom-g.innerTop);

          // This centred rectangle is deliberately smaller than the green inner pill.
          // Its full rectangular bounds stay inside the infield on wide and narrow screens.
          const boxW=innerW*0.62;
          const boxH=innerH*0.68;

          currentInfo.style.setProperty('left',g.cx+'px','important');
          currentInfo.style.setProperty('top',g.cy+'px','important');
          currentInfo.style.setProperty('width',boxW+'px','important');
          currentInfo.style.setProperty('max-width','none','important');
          currentInfo.style.setProperty('max-height',boxH+'px','important');
          currentInfo.style.setProperty('transform','translate(-50%,-50%)','important');
          currentInfo.style.setProperty('overflow','hidden','important');

          hideSimpleRacePanel();
        }catch(e){}
        win.requestAnimationFrame(lock);
      };
      win.requestAnimationFrame(lock);
    }

    hideSimpleRacePanel();
  }catch(e){}
}

frame.addEventListener('load',()=>{
  sizeFrame();
  installRacingFix();
  setTimeout(()=>{sizeFrame();installRacingFix();},200);
  setTimeout(()=>{sizeFrame();installRacingFix();},800);
  try{
    const doc=frame.contentDocument;
    if(window.ResizeObserver&&doc){
      const ro=new ResizeObserver(sizeFrame);
      ro.observe(doc.documentElement);
      if(doc.body)ro.observe(doc.body);
    }
  }catch(e){}
});

window.addEventListener('resize',()=>{
  sizeFrame();
  installRacingFix();
});
</script>
</body>
</html>
