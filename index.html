<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O'Sullivan Clan Racing</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#07120c;overflow-x:hidden}
#game{display:block;width:100%;border:0;min-height:100vh}
</style>
</head>
<body>
<iframe id="game" src="game.html" title="O'Sullivan Clan Racing"></iframe>
<script>
const frame=document.getElementById('game');
function tuneGame(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    let style=doc.getElementById('chatgpt-racing-layout-tweak');
    if(!style){
      style=doc.createElement('style');
      style.id='chatgpt-racing-layout-tweak';
      style.textContent=`
        .track-info{width:min(52%,620px)!important;}
        @media(max-width:760px){.track-info{width:72%!important;}}
      `;
      doc.head.appendChild(style);
    }
    const resize=()=>{
      const h=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0,window.innerHeight);
      frame.style.height=h+'px';
    };
    resize();
    if(window.ResizeObserver){
      const ro=new ResizeObserver(resize);
      ro.observe(doc.documentElement);
      if(doc.body)ro.observe(doc.body);
    }
    setTimeout(resize,250);
    setTimeout(resize,1000);
  }catch(e){
    frame.style.height='100vh';
  }
}
frame.addEventListener('load',tuneGame);
window.addEventListener('resize',()=>{
  try{
    const doc=frame.contentDocument;
    if(doc){frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0,window.innerHeight)+'px';}
  }catch(e){}
});
</script>
</body>
</html>
