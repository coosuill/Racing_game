<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>O'Sullivan Clan Racing</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#07120c;overflow-x:hidden}
#game{display:block;width:100%;border:0;min-height:100vh}
</style>
</head>
<body>
<iframe id="game" src="game.html?v=20260808-1312-seasoncolumns" title="O'Sullivan Clan Racing"></iframe>
<script>
const frame=document.getElementById('game');

function sizeFrame(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body?doc.body.scrollHeight:0,window.innerHeight)+'px';
  }catch(e){frame.style.height='100vh';}
}

function installRacingFix(){
  try{
    const win=frame.contentWindow;
    const doc=frame.contentDocument;
    if(!win||!doc)return;

    let style=doc.getElementById('manual-racing-hud-fix');
    if(!style){
      style=doc.createElement('style');
      style.id='manual-racing-hud-fix';
      style.textContent=`
        .banner{display:none!important;}
        .lap-counter{
          left:10px!important;right:auto!important;top:10px!important;z-index:7!important;
          padding:7px 10px!important;border-radius:999px!important;
          background:rgba(0,0,0,.62)!important;color:#fff!important;
          font-size:13px!important;font-weight:bold!important;pointer-events:none!important;
        }
        #trackInfo{
          position:absolute!important;
          z-index:5!important;
          box-sizing:border-box!important;
          margin:0!important;
          overflow:hidden!important;
          pointer-events:none!important;
          padding:6px 8px!important;
        }
        #trackInfo .track-info-title{font-size:10px!important;margin-bottom:3px!important;}
        #trackInfo .track-info-grid{gap:4px!important;}
        #trackInfo .track-info-section{padding:4px 5px!important;min-width:0!important;}
        #trackInfo .track-info-section h3{font-size:8px!important;margin-bottom:2px!important;}
        #trackInfo .track-live-list,#trackInfo .track-score-list,#trackInfo .track-result-list{font-size:8px!important;gap:1px!important;}
        #trackInfo .track-live-row{grid-template-columns:17px minmax(55px,1fr) auto auto auto!important;gap:2px!important;}
        #trackInfo .track-live-row .ability,#trackInfo .track-live-row .race-state,#trackInfo .track-live-row .gap-cell{font-size:7px!important;}
        #latestChangeNote{
          display:inline-block!important;margin-left:7px!important;font-size:9px!important;
          line-height:1.1!important;font-weight:normal!important;letter-spacing:0!important;
          color:var(--muted)!important;opacity:.70!important;vertical-align:middle!important;white-space:nowrap!important;
        }
        @media(max-width:600px){
          #trackInfo{padding:4px 5px!important;}
          #trackInfo .track-live-row{grid-template-columns:15px minmax(42px,1fr) auto!important;gap:2px!important;}
          #trackInfo .track-live-row .ability,#trackInfo .track-live-row .status-cell{display:none!important;}
          #latestChangeNote{font-size:8px!important;white-space:normal!important;}
        }
      `;
      doc.head.appendChild(style);
    }

    const heading=doc.querySelector('h1');
    if(heading){
      let note=doc.getElementById('latestChangeNote');
      if(!note){
        note=doc.createElement('span');
        note.id='latestChangeNote';
        heading.appendChild(note);
      }
      note.textContent='Latest: Season tables side-by-side · positions full-height';
    }

    const shell=doc.getElementById('trackShell');
    const info=doc.getElementById('trackInfo');
    if(!shell||!info)return;

    const staleZone=doc.getElementById('safeInfieldHudZone');
    if(staleZone)staleZone.remove();

    if(info.parentNode!==shell){
      const commentary=doc.getElementById('commentary');
      shell.insertBefore(info,commentary||null);
    }

    if(!win.__manualHudLockStarted){
      win.__manualHudLockStarted=true;

      const manualLock=()=>{
        try{
          const currentInfo=doc.getElementById('trackInfo');
          const currentShell=doc.getElementById('trackShell');
          if(currentInfo&&currentShell){
            if(currentInfo.parentNode!==currentShell){
              const commentary=doc.getElementById('commentary');
              currentShell.insertBefore(currentInfo,commentary||null);
            }

            const w=currentShell.clientWidth||1;
            const h=currentShell.clientHeight||1;
            const grid=currentInfo.querySelector('.track-info-grid');
            const sectionTitles=Array.from(currentInfo.querySelectorAll('.track-info-section h3')).map(el=>el.textContent.trim().toLowerCase());
            const isSeasonView=sectionTitles.some(t=>t.indexOf('season')===0);

            // Normal race layout remains unchanged. Season gets a little extra width only
            // so Live Positions and Season Standings can stay adjacent at all screen sizes.
            const boxW=isSeasonView
              ? Math.max(190,Math.min(560,w*0.48))
              : Math.max(150,Math.min(500,w*0.42));
            const boxH=Math.max(150,Math.min(320,h*0.55));

            currentInfo.style.setProperty('left','50%','important');
            currentInfo.style.setProperty('top','50%','important');
            currentInfo.style.setProperty('width',boxW+'px','important');
            currentInfo.style.setProperty('max-width',boxW+'px','important');
            currentInfo.style.setProperty('max-height',boxH+'px','important');
            currentInfo.style.setProperty('transform','translate(-50%,-50%)','important');
            currentInfo.style.setProperty('overflow','hidden','important');

            if(grid){
              if(isSeasonView){
                grid.style.setProperty('grid-template-columns','minmax(0,1fr) minmax(0,1fr)','important');
              }else{
                grid.style.removeProperty('grid-template-columns');
              }
            }
          }

          const title=doc.getElementById('metaTitle');
          const panel=doc.getElementById('metaPanel');
          if(title){
            const section=title.closest('section.panel');
            if(section){
              const titleText=title.textContent.trim().toLowerCase();
              const panelText=panel?panel.textContent.trim().toLowerCase():'';
              const isSingleRacePanel=titleText==='race' && (panelText.includes('single race') || panelText.includes('single'));
              section.style.setProperty('display',isSingleRacePanel?'none':'','important');
            }
          }
        }catch(e){}
        win.requestAnimationFrame(manualLock);
      };

      win.requestAnimationFrame(manualLock);
    }
  }catch(e){}
}

frame.addEventListener('load',()=>{
  sizeFrame();
  installRacingFix();
  setTimeout(()=>{sizeFrame();installRacingFix();},200);
  setTimeout(()=>{sizeFrame();installRacingFix();},800);
  try{
    const doc=frame.contentDocument;
    if(window.ResizeObserver&&doc){
      const ro=new ResizeObserver(sizeFrame);
      ro.observe(doc.documentElement);
      if(doc.body)ro.observe(doc.body);
    }
  }catch(e){}
});

window.addEventListener('resize',()=>{
  sizeFrame();
  installRacingFix();
});
</script>
</body>
</html>
